name: Fuzz

# The hosted scanner parses attackers' repositories with tree-sitter, which is
# C. Nightly, every grammar and analyzer is fuzzed with AddressSanitizer, which
# fails on memory errors in the C parsers that would otherwise pass silently.
# A failing input is kept as an artifact; add it to the fuzz corpus as a test.

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Parser and analyzer tests with AddressSanitizer
        run: go test -asan -count=1 ./parsing ./analyzers/...
      - name: Fuzz every analyzer with AddressSanitizer
        run: go test -asan -run='^$' -fuzz=FuzzAnalyzers -fuzztime=30m ./analyzers/fuzz
      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failure
          path: analyzers/fuzz/testdata/fuzz
          if-no-files-found: ignore
